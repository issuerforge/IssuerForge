[package]
name = "issuer-forge"
version = "0.1.0"
edition = "2021"
description = "Compliance rules as data: one audited program serving every stablecoin issuer"

[lib]
crate-type = ["cdylib", "lib"]
name = "issuer_forge"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.32.1", features = ["init-if-needed"] }
# token_interface: Token-2022 mints and token accounts; without them there is
# no extension the project is built on.
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
# Exactly 0.10.0. anchor-spl 0.32.1 pulls spl-token-2022 ^8, and that pulls
# exactly this branch. The 2.x versions sit on solana-* 3.x and yield two
# different Pubkeys in one crate.
spl-transfer-hook-interface = "=0.10.0"
spl-tlv-account-resolution = "=0.10.0"
spl-pod = "=0.5.1"
# The `Execute` instruction discriminator is set by the interface, not by
# Anchor. The version is the one already in the tree through
# spl-transfer-hook-interface 0.10.0.
spl-discriminator = "=0.4.1"
# The rules are read from the account on every transfer — zero_copy, no allocations.
bytemuck = { version = "1.25", features = ["derive"] }
# sha256 for `rules_hash`. A separate dependency because anchor-lang 0.32.1
# does not re-export `solana_program::hash` — its `solana_program` is
# assembled from the split crates, and the hasher is not among them. Exactly
# 2.3.0: mollusk pulls the 3.1.0 branch (agave 4.x), and two different
# `Hash`es in one crate is the same story as `Pubkey` in
# spl-transfer-hook-interface 2.x.
solana-sha256-hasher = "=2.3.0"

[dev-dependencies]
# The differential test fixtures (T019) are JSON, because the TS half reads
# them too. The version is the one already in the tree through anchor:
# serde_json has no solana-* tree of its own and cannot bring one in.
serde_json = "1.0.151"
# The hook is called by the token program, not by our code: without a real
# runtime and the Token-2022 ELF no test gets as far as the rule check.
# litesvm does not compile here against anchor 0.32.1 (E0027 on touched_flags).
mollusk-svm = "0.15.0"
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = [
  "token-2022",
  "associated-token",
] }
# The type branch in mollusk (agave 4.x) is not the one anchor-lang 0.32.1
# lives in (solana-program 2.3). These are two different Pubkeys; the bridge
# between them is to_bytes().
solana-account = "4.3"
solana-instruction = "3.4"
solana-pubkey = "4.2"
