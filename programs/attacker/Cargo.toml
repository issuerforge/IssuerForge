[package]
name = "attacker"
version = "0.1.0"
edition = "2021"
description = "A minimal foreign program: transfers the token via CPI to prove that the token enforces the rule, not the app"

[lib]
crate-type = ["cdylib", "lib"]
name = "attacker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
