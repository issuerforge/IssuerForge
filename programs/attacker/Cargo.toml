[package]
name = "attacker"
version = "0.1.0"
edition = "2021"
description = "Мінімальна чужа програма: переказує токен через CPI, щоб довести, що правило виконує токен, а не застосунок"

[lib]
crate-type = ["cdylib", "lib"]
name = "attacker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token_2022"] }
