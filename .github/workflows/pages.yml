name: Pages

# Deploys the landing page (apps/landing) and the issuer console (apps/web)
# to GitHub Pages as one artifact:
# https://issuerforge.github.io/IssuerForge/       landing, plain static files
# https://issuerforge.github.io/IssuerForge/app/   console
#
# Only static files go here. The api holds keys and a database
# connection and is hosted elsewhere (render.yaml); the console reaches it
# through VITE_API_URL. The bundle is public, so every VITE_* value is public
# too — the paid RPC node with a key stays on the api side (DEVNET_RPC_URL).
#
# Repository settings, once, by the owner:
#   Settings → Pages → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → Variables:
#     VITE_API_URL          https://issuerforge-api.onrender.com
#     VITE_PRIVY_APP_ID     the Privy app id (public identifier, not a key)
#     VITE_DEVNET_RPC_URL   optional; defaults to the public devnet node
#     PAGES_BASE_PATH       only for a custom domain: "/app/" (the console's
#                           base; the landing then takes the domain's root)
#
# Rust is not needed: the IDL is vendored in packages/chain.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push waits for the running one rather than
# cancelling it: a cancelled deploy leaves Pages half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # takes the version from package.json → packageManager

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The console lives under /<repo>/app/; a custom domain sets
      # PAGES_BASE_PATH to /app/. The web build fails loudly on a missing or
      # placeholder variable — see apps/web/src/env.ts — rather than shipping
      # a bundle that cannot log in.
      - name: Build the console
        run: pnpm --filter @forge/web build
        env:
          BASE_PATH: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_DEVNET_RPC_URL: ${{ vars.VITE_DEVNET_RPC_URL || 'https://api.devnet.solana.com' }}

      # Pages has no rewrites and serves a custom 404.html only from the site
      # root, never from /app/. So the root 404.html is the console's shell,
      # and the router takes over on a deep link. In front of it, a redirect
      # for links from before the console moved to /app/: /<repo>/x becomes
      # /<repo>/app/x instead of a console mounted under the wrong basename.
      - name: Assemble the site
        env:
          APP_BASE: ${{ vars.PAGES_BASE_PATH || format('/{0}/app/', github.event.repository.name) }}
        run: |
          mkdir -p dist
          cp -r apps/landing/. dist/
          cp -r apps/web/dist dist/app
          node -e '
            const fs = require("node:fs")
            const app = process.env.APP_BASE
            const site = app.replace(/app\/$/, "")
            const redirect = `<script>(function(){var a=${JSON.stringify(app)},s=${JSON.stringify(site)},p=location.pathname;` +
              `if(p.indexOf(a)!==0&&p.indexOf(s)===0)location.replace(a+p.slice(s.length)+location.search+location.hash)})()</script>`
            const shell = fs.readFileSync("dist/app/index.html", "utf8")
            if (!shell.includes("<head>")) throw new Error("no <head> in the console shell")
            fs.writeFileSync("dist/404.html", shell.replace("<head>", "<head>" + redirect))
          '

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
