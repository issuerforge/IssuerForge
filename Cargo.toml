[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# Програма рахує ліміти переказів, резерв і комісію. Тихе переповнення тут — це
# або пропущений переказ понад ліміт, або емісія понад резерв, тому перевірки
# лишаються увімкненими і в релізі.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
