[workspace]
members = ["programs/*"]
resolver = "2"

[profile.release]
# The program computes transfer limits, the reserve and the fee. A silent
# overflow here is either a transfer let through above the limit or an issuance
# above the reserve, so the checks stay on in release too.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
